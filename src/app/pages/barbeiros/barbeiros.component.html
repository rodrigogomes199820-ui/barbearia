<div class="clientes">

  <div class="page-header">

    <div>
      <h1>Barbeiros</h1>
      <p>Gerencie os Barbeiros da sua barbearia.</p>
    </div>

    <button
    
    (click)="abrirDialog()"
     mat-raised-button>
      <mat-icon>person_add</mat-icon>
      Novo barbeiro
    </button>

  </div>


  <div class="mat-elevation-z8">

    <table
      mat-table
      [dataSource]="dataSource"
    >



      <ng-container matColumnDef="nome">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Nome
        </th>

        <td
          mat-cell
          *matCellDef="let barbeiro"
        >
          {{  barbeiro.nome }}
        </td>

      </ng-container>


  

      <ng-container matColumnDef="telefone">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Telefone
        </th>

        <td
          mat-cell
          *matCellDef="let barbeiro"
        >
          {{  barbeiro.telefone }}
        </td>

      </ng-container>


   

      <ng-container matColumnDef="email">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          E-mail
        </th>

        <td
          mat-cell
          *matCellDef="let barbeiro"
        >
          {{  barbeiro.email }}
        </td>

      </ng-container>

      <ng-container matColumnDef="especialidade">

  <th
    mat-header-cell
    *matHeaderCellDef
  >
    Especialidade
  </th>

  <td
    mat-cell
    *matCellDef="let barbeiro"
  >
    {{ barbeiro.especialidade }}
  </td>

</ng-container>

      <ng-container matColumnDef="acoes">

  <th
    mat-header-cell
    *matHeaderCellDef
  >
    
  </th>

  <td
    mat-cell
    *matCellDef="let  barbeiro"
  >

    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
    >
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">

      <button 
      (click)="editarBarbeiro()"
      mat-menu-item>
        <mat-icon>edit_note</mat-icon>
        <span>Editar</span>
      </button>

       <button 
      (click)="historicoBarbeiro()"
      mat-menu-item>
        <mat-icon>manage_history</mat-icon>
        <span>Historico</span>
      </button>

      <button 
      (click)="excluirBarbeiro()"
       mat-menu-item>
        <mat-icon>delete_outline</mat-icon>
        <span>Excluir</span>
      </button>

    </mat-menu>

  </td>

</ng-container>


  

     


      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>

    </table>


<mat-paginator
  [length]="totalBarbeiros"
  [pageSize]="limit"
  [pageSizeOptions]="[5, 10, 20]"
  showFirstLastButtons
  (page)="alterarPagina($event)">
</mat-paginator>  

  </div>

</div>
