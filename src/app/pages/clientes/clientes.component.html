<div class="clientes">

  <div class="page-header">

    <div>
      <h1>Clientes</h1>
      <p>Gerencie os clientes da sua barbearia.</p>
    </div>

    <button
    
    (click)="abrirDialog()"
     mat-raised-button>
      <mat-icon>person_add</mat-icon>
      Novo cliente
    </button>

  </div>


  <div class="mat-elevation-z8">

    <table
      mat-table
      [dataSource]="dataSource"
    >



      <ng-container matColumnDef="nome">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Nome
        </th>

        <td
          mat-cell
          *matCellDef="let cliente"
        >
          {{ cliente.nome }}
        </td>

      </ng-container>


  

      <ng-container matColumnDef="telefone">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Telefone
        </th>

        <td
          mat-cell
          *matCellDef="let cliente"
        >
          {{ cliente.telefone }}
        </td>

      </ng-container>


   

      <ng-container matColumnDef="email">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          E-mail
        </th>

        <td
          mat-cell
          *matCellDef="let cliente"
        >
          {{ cliente.email }}
        </td>

      </ng-container>

      <ng-container matColumnDef="acoes">

  <th
    mat-header-cell
    *matHeaderCellDef
  >
    
  </th>

  <td
    mat-cell
    *matCellDef="let cliente"
  >

    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
    >
      <mat-icon>more_vert</mat-icon>
    </button>

    <mat-menu #menu="matMenu">

      <button mat-menu-item>
        <mat-icon>edit</mat-icon>
        <span>Editar</span>
      </button>

      <button mat-menu-item>
        <mat-icon>delete</mat-icon>
        <span>Excluir</span>
      </button>

    </mat-menu>

  </td>

</ng-container>


  

     


      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>

    </table>


    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    ></mat-paginator>

  </div>

</div>
